name: Verify all 11 pinned source trees in complete archive
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    paths:
      - '.github/workflows/mirror-all-upstream.yml'
      - 'scripts/verify_source_snapshot.py'
      - 'sources.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ruoshui-full-mirror-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            .github
            scripts
            tests
            sources.json
          sparse-checkout-cone-mode: true
      - name: Fetch immutable original source tree
        run: git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin refs/heads/full-source-archive:refs/remotes/origin/full-source-archive
      - name: Verify exact pinned Git tree SHAs and 7222 files
        run: python3 scripts/verify_source_snapshot.py
