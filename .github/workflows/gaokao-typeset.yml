name: XeLaTeX typeset historical Gaokao maths (1952-1999)
on:
  push:
    paths:
      - ".github/workflows/gaokao-typeset.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "1952-1999 only; blank = newest pending historical year"
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: gaokao-yearly-typeset
  cancel-in-progress: false
jobs:
  typeset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            typeset
            .github
      - name: Test historical-only safeguards
        run: python3 -m unittest discover -s project/typeset/tests -v
      - id: pick
        name: Select next year
        env:
          REQ: "${{ inputs.year || '' }}"
        run: |
          y=$(python3 project/typeset/select_year.py --year "$REQ")
          echo "year=$y" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pick.outputs.year != ''
        with:
          path: source
          ref: full-source-archive
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mirror/gaokao-math-problems-compilation/styles.tex
            mirror/gaokao-math-problems-compilation/statistical-charts.tex
            mirror/gaokao-math-problems-compilation/index/${{ steps.pick.outputs.year }}.tex
            mirror/gaokao-math-problems-compilation/content/${{ steps.pick.outputs.year }}/
            mirror/gaokao-math-problems-compilation/img/${{ steps.pick.outputs.year }}/
            mirror/gaokao-math-problems-compilation/img_repaint/${{ steps.pick.outputs.year }}/
            mirror/gaokao-math-problems-compilation/tools/typeset/generated_image_layout.tex
            mirror/gaokao-math-problems-compilation/tools/crop/manual_image_layout.tex
      - name: Guard historical years only
        if: steps.pick.outputs.year != ''
        shell: bash
        run: |
          set -euo pipefail
          year="${{ steps.pick.outputs.year }}"
          test "$year" -ge 1952 && test "$year" -le 1999
      - name: Verify originals and prepare unified design
        if: steps.pick.outputs.year != ''
        run: |
          python3 project/typeset/build_year.py \
             --year ${{ steps.pick.outputs.year }} \
             --source source/mirror/gaokao-math-problems-compilation \
             --report project/typeset/reports/${{ steps.pick.outputs.year }}.json
      - uses: xu-cheng/latex-action@v4
        if: steps.pick.outputs.year != ''
        with:
          os: debian
          working_directory: source/mirror/gaokao-math-problems-compilation
          root_file: __ruoshui_${{ steps.pick.outputs.year }}.tex
          latexmk_use_xelatex: true
      - name: Install PDF inspection tools
        if: steps.pick.outputs.year != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet pypdf
      - name: PDF integrity, glyphs and source checks
        if: steps.pick.outputs.year != ''
        run: |
          set -euo pipefail
          root=source/mirror/gaokao-math-problems-compilation
          pdf="$root/__ruoshui_${{ steps.pick.outputs.year }}.pdf"
          test -s "$pdf"
          test "$(head -c 5 "$pdf")" = "%PDF-"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 1
          pdftotext "$pdf" "$RUNNER_TEMP/typeset.txt"
          test -s "$RUNNER_TEMP/typeset.txt"
          log="$root/__ruoshui_${{ steps.pick.outputs.year }}.log"
          if test -f "$log"; then
            # TikZ/PGF layout probing can emit a harmless ';' in nullfont.
            # Reject only glyphs missing from real output fonts.
            grep 'Missing character:' "$log" | grep -Fv 'in font nullfont!' > "$RUNNER_TEMP/real-missing-glyphs.txt" || true
            if test -s "$RUNNER_TEMP/real-missing-glyphs.txt"; then
              echo "Real output glyphs missing - reject PDF" >&2
              cat "$RUNNER_TEMP/real-missing-glyphs.txt" >&2
              exit 1
            fi
          fi
          mkdir -p project/typeset/annual project/typeset/tex
          cp "$pdf" project/typeset/annual/ruoshui-gaokao-${{ steps.pick.outputs.year }}.pdf
          cp "$root/__ruoshui_${{ steps.pick.outputs.year }}.tex" project/typeset/tex/ruoshui-gaokao-${{ steps.pick.outputs.year }}.tex
          python3 -c 'import json,sys;from pathlib import Path;p=Path(sys.argv[1]);d=json.loads(p.read_text());d.update({"pdf_pages":int(sys.argv[2]),"compiled":True,"pdf_QA":"passed"});p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")' project/typeset/reports/${{ steps.pick.outputs.year }}.json "$pages"
      - name: Split each bookmarked chapter into its own PDF and TeX source
        if: steps.pick.outputs.year != ''
        run: |
          python3 project/typeset/split_year.py \
            --year "${{ steps.pick.outputs.year }}" \
            --root source/mirror/gaokao-math-problems-compilation \
            --annual project/typeset/annual/ruoshui-gaokao-${{ steps.pick.outputs.year }}.pdf \
            --entry project/typeset/tex/ruoshui-gaokao-${{ steps.pick.outputs.year }}.tex \
            --dest project/typeset/papers/${{ steps.pick.outputs.year }} \
            --report project/typeset/reports/${{ steps.pick.outputs.year }}.json
      - name: Verify Chinese body in every published TeX and PDF
        if: steps.pick.outputs.year != ''
        run: |
          python3 project/typeset/validate_chinese.py \
            --project project \
            --report project/typeset/reports/${{ steps.pick.outputs.year }}.json
      - name: Package fully compilable Chinese source and original figures
        if: steps.pick.outputs.year != ''
        run: |
          python3 project/typeset/make_source_bundle.py \
            --root source/mirror/gaokao-math-problems-compilation \
            --year "${{ steps.pick.outputs.year }}" \
            --papers project/typeset/papers/${{ steps.pick.outputs.year }} \
            --out project/typeset/source-bundles/ruoshui-gaokao-${{ steps.pick.outputs.year }}-source.zip
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.year != ''
        with:
          name: gaokao-yearly-${{ steps.pick.outputs.year }}
          path: |
            project/typeset/annual/ruoshui-gaokao-${{ steps.pick.outputs.year }}.pdf
            project/typeset/tex/ruoshui-gaokao-${{ steps.pick.outputs.year }}.tex
            project/typeset/reports/${{ steps.pick.outputs.year }}.json
            project/typeset/papers/${{ steps.pick.outputs.year }}/
            project/typeset/source-bundles/ruoshui-gaokao-${{ steps.pick.outputs.year }}-source.zip
          if-no-files-found: error
      - name: Keep original PDFs; publish separately
        if: steps.pick.outputs.year != ''
        run: |
          cd project
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f "typeset/blocked/${{ steps.pick.outputs.year }}.json"
          git add -A typeset
          git commit -m "typeset: create Gaokao ${{ steps.pick.outputs.year }} annual volume [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Save blocked year and workflow link so later years can continue
        if: failure() && steps.pick.outputs.year != ''
        env:
          YEAR: "${{ steps.pick.outputs.year }}"
        run: |
          set -euo pipefail
          cd project
          mkdir -p typeset/blocked
          python3 -c 'import json,os;from pathlib import Path;y=os.environ["YEAR"];p=Path("typeset/blocked")/(y+".json");p.write_text(json.dumps({"year":y,"status":"blocked-needs-review","workflow_run":os.environ["GITHUB_RUN_ID"],"note":"Open failed Actions step and inspect TeX/image/PDF QA logs"},indent=2)+"\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "typeset/blocked/$YEAR.json"
          git commit -m "typeset: flag $YEAR for manual source/visual review [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
