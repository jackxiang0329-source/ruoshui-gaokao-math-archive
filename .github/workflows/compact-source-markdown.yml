name: One-time safe upstream Markdown consolidation
on:
  push:
    paths:
      - '.github/workflows/compact-source-markdown.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-markdown-compaction
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          submodules: false
          sparse-checkout: |
            .github
            scripts
            archive
            sources.json
          sparse-checkout-cone-mode: true
      - name: Fetch immutable full-source-archive branch
        run: git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin refs/heads/full-source-archive:refs/remotes/origin/full-source-archive
      - name: Consolidate source texts and guard every original SHA
        run: python3 scripts/compact_source_markdown.py
      - name: Commit compact layout to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A archive/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git diff --cached --stat | tail -10
          git commit -m "docs: consolidate 215 source Markdown files with original snapshot and SHA map"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
