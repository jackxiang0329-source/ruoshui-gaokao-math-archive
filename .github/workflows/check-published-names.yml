name: Check Gaokao PDF and LaTeX naming, pairing and SHA
on:
  pull_request:
  push:
    paths:
      - 'papers/**'
      - 'topics/**'
      - 'derivative/reviewed/**'
      - 'catalog/normalized_files.csv'
      - 'scripts/check_published_names.py'
      - '.github/workflows/check-published-names.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - run: python3 scripts/check_published_names.py
