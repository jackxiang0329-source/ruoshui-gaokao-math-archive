name: Offline archive QA
on:
  push:
    paths:
      - ".github/workflows/audit-archive.yml"
      - ".gitmodules"
      - "sources.json"
      - "scripts/**"
      - "tests/**"
      - "index/**"
      - "metadata/**"
      - "derivative/reviewed/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out metadata only (avoid upstream symlinks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            .github
            scripts
            tests
            index
            metadata
            derivative
            sources.json
            .gitmodules
          sparse-checkout-cone-mode: true
      - name: Confirm all Git links match pinned revisions
        run: python3 scripts/validate_pinned_sources.py --index-only
      - name: Run isolated tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify question-index and review provenance
        run: |
          python3 scripts/validate_question_index.py
          python3 scripts/validate_review_traceability.py
