name: Build merged reviewed mathematics PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.tex'
      - '.github/workflows/build-reviewed-pdfs.yml'
permissions:
  contents: write
concurrency:
  group: gaokao-reviewed-solutions-pdf
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Compile merged XeLaTeX source
        uses: xu-cheng/latex-action@v4
        with:
          os: debian
          root_file: derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.tex
          latexmk_use_xelatex: true
          continue_on_error: false
      - name: Normalize XeLaTeX output location and check PDF integrity
        shell: bash
        run: |
          set -euo pipefail
          stem="gaokao-2010-2025-calculus-reviewed-solutions"
          pdf="derivative/reviewed/${stem}.pdf"
          # latex-action generates the PDF in its working directory rather
          # than beside root_file when given a relative root_file path.
          if test -s "${stem}.pdf"; then
            mv -f -- "${stem}.pdf" "$pdf"
          fi
          test -s "$pdf"
          test "$(head -c 5 "$pdf")" = "%PDF-"
          pdfinfo "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "${pages:-0}" -ge 2
          pdftotext "$pdf" "$RUNNER_TEMP/${stem}.txt"
          test -s "$RUNNER_TEMP/${stem}.txt"
          grep -q '2010' "$RUNNER_TEMP/${stem}.txt"
          log=$(find . -maxdepth 4 -type f -name "${stem}.log" -print -quit)
          if test -n "$log" && grep -q "Missing character:" "$log"; then
            echo "XeLaTeX reports unsupported glyphs:" >&2
            grep "Missing character:" "$log" >&2
            exit 1
          fi
      - name: Keep compiled PDF as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-gaokao-calculus-pdf
          path: derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified PDF on main
        shell: bash
        run: |
          set -euo pipefail
          pdf="derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.pdf"
          test -s "$pdf"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$pdf"
          if ! git diff --cached --quiet; then
            git commit -m "build: publish merged reviewed solution PDF [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
