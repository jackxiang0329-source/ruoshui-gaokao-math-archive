name: Build merged reviewed mathematics PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.tex'
      - '.github/workflows/build-reviewed-pdfs.yml'
permissions:
  contents: write
concurrency:
  group: gaokao-reviewed-solutions-pdf
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Compile merged XeLaTeX source
        uses: xu-cheng/latex-action@v4
        with:
          os: debian
          root_file: derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.tex
          latexmk_use_xelatex: true
          continue_on_error: false
      - name: Check output and publish paired PDF
        shell: bash
        run: |
          set -euo pipefail
          pdf="derivative/reviewed/gaokao-2010-2025-calculus-reviewed-solutions.pdf"
          test -s "$pdf"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$pdf"
          if ! git diff --cached --quiet; then
            git commit -m "build: publish merged reviewed solution PDF [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
