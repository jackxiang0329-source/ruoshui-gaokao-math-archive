name: One-time review Markdown proof consolidation
on:
  push:
    paths:
      - '.github/workflows/compact-review-markdown.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-proof-compaction
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: true
          sparse-checkout: |
            .github
            scripts
            derivative
            metadata
            index
          sparse-checkout-cone-mode: true
      - name: Merge source-checked reviewed Markdown and update pointers
        run: python3 scripts/consolidate_reviewed_proofs.py
      - name: Verify canonical review provenance still works
        run: python3 scripts/validate_review_traceability.py
      - name: Commit fewer Markdown documents to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A scripts/ derivative/ metadata/ index/
          git commit -m "docs: consolidate 14 reviewed Markdown proofs into one traceable volume"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
