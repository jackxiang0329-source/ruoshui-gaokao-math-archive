name: Backfill complete Chinese source bundles (1952 and 2026)
on:
  push:
    paths:
      - ".github/workflows/backfill-gaokao-chinese-sources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bundle:
    strategy:
      fail-fast: false
      matrix:
        year: ["1952", "2026"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          sparse-checkout: |
            typeset
      - uses: actions/checkout@v4
        with:
          ref: full-source-archive
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mirror/gaokao-math-problems-compilation/styles.tex
            mirror/gaokao-math-problems-compilation/statistical-charts.tex
            mirror/gaokao-math-problems-compilation/index/${{ matrix.year }}.tex
            mirror/gaokao-math-problems-compilation/content/${{ matrix.year }}/
            mirror/gaokao-math-problems-compilation/img/${{ matrix.year }}/
            mirror/gaokao-math-problems-compilation/img_repaint/${{ matrix.year }}/
            mirror/gaokao-math-problems-compilation/tools/typeset/generated_image_layout.tex
            mirror/gaokao-math-problems-compilation/tools/crop/manual_image_layout.tex
      - name: Validate original sources and build Fandol-compatible TeX wrapper
        run: |
          set -euo pipefail
          python3 project/typeset/build_year.py \
            --source source/mirror/gaokao-math-problems-compilation \
            --year "${{ matrix.year }}" \
            --report "$RUNNER_TEMP/source-report-${{ matrix.year }}.json"
      - name: Confirm every published TeX contains complete Chinese text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          year="${{ matrix.year }}"
          folder=Path("project/typeset/papers")/year
          data=sorted(folder.glob("*.tex"))
          assert len(data)==(1 if year=="1952" else 6),data
          for path in data:
              content=path.read_text(encoding="utf-8")
              n=sum("\u3400"<=c<="\u9fff" for c in content)
              assert n>=100 and r"\begin{problem}" in content,(path,n)
              assert "END UPSTREAM CHINESE CONTENT" in content,path
              print(path,n,"Chinese chars")
          PY
      - name: Generate complete recompilable source ZIP with all year figures
        run: |
          python3 project/typeset/make_source_bundle.py \
            --root source/mirror/gaokao-math-problems-compilation \
            --year "${{ matrix.year }}" \
            --papers project/typeset/papers/${{ matrix.year }} \
            --out project/typeset/source-bundles/ruoshui-gaokao-${{ matrix.year }}-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gaokao-full-chinese-source-${{ matrix.year }}
          path: project/typeset/source-bundles/ruoshui-gaokao-${{ matrix.year }}-source.zip
          if-no-files-found: error
          retention-days: 90
