project:
  id: gaokao_math_library
  title: 新高考数学试题知识库
  language: zh-CN
  authoritative_sources:
    - Markdown
    - YAML
    - image

corpus_scope:
  phase: initial
  series:
    - id: national_new_gaokao
      title: 新高考全国卷
      volumes:
        - I
        - II
      years:
        - 2021
        - 2022
        - 2023
        - 2024
        - 2025
        - 2026

excluded_content:
  - answers
  - solutions
  - solution_steps
  - recommended_methods
  - difficulty
  - secondary_knowledge_points
  - ability_dimensions
  - similar_item_relations
  - manually_transcribed_points

derived_artifacts:
  git_tracked: false
  paths:
    - build/
    - dist/
  examples:
    - SQLite
    - full_text_index
    - statistics
    - static_site
    - release_archive

local_work_artifacts:
  git_tracked: false
  paths:
    - work/
  examples:
    - source_pdf
    - community_typeset_file
    - page_image
    - ocr_temp_file
    - intermediate_crop
