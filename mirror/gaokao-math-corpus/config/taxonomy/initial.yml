status: draft
annotation_scope:
  allowed_fields:
    - problem_kind
    - primary_knowledge_point
  forbidden_fields:
    - difficulty
    - solution_method
    - ability_dimension
    - form_feature
    - secondary_knowledge_points
    - similar_item_relations

problem_kinds:
  - 函数与导数
  - 三角函数与解三角形
  - 平面向量
  - 数列
  - 立体几何
  - 解析几何
  - 概率统计
  - 复数
  - 集合与逻辑
  - 不等式
  - 其他
  - 待确认

primary_knowledge_point_policy:
  granularity: coarse
  value_source: maintainer_or_reviewed_agent_annotation
  allow_free_text: true
  fallback_value: 待确认
  notes:
    - 当前不维护完整知识点体系。
    - agent 可以给出一个主要知识点，但必须保守标注；拿不准时填写“待确认”。
